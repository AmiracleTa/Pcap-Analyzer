<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">pcap-analyzer 架构设计</title>
  <desc id="desc">展示 Vue 前端、Spring Boot API、业务服务、基础设施、MySQL、文件存储、tshark 和 AI API 的分层架构。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#152238" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52606d; }
      .layer { fill: #ffffff; stroke: #dde4ee; stroke-width: 1.4; }
      .layer-title { font-size: 17px; font-weight: 700; fill: #52606d; }
      .box { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-text { font-size: 12px; fill: #52606d; }
      .arrow { stroke: #52606d; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #8492a6; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#f6f8fb"/>
  <text x="54" y="58" class="title">架构设计</text>
  <text x="54" y="86" class="subtitle">前后端分离，后端按 Controller / Service / Repository / Infrastructure 分层。</text>

  <rect x="54" y="122" width="1072" height="92" rx="16" class="layer"/>
  <rect x="54" y="244" width="1072" height="118" rx="16" class="layer"/>
  <rect x="54" y="392" width="1072" height="136" rx="16" class="layer"/>
  <rect x="54" y="558" width="1072" height="108" rx="16" class="layer"/>

  <text x="78" y="154" class="layer-title">前端表现层</text>
  <text x="78" y="276" class="layer-title">后端接口层</text>
  <text x="78" y="424" class="layer-title">业务服务层</text>
  <text x="78" y="590" class="layer-title">数据与外部依赖</text>

  <g>
    <rect x="202" y="144" width="176" height="48" rx="12" class="box" stroke="#1d8bff"/>
    <text x="290" y="165" text-anchor="middle" class="box-title">Vue 3 页面</text>
    <text x="290" y="184" text-anchor="middle" class="box-text">文件管理与分析结果</text>
  </g>
  <g>
    <rect x="460" y="144" width="176" height="48" rx="12" class="box" stroke="#06b6d4"/>
    <text x="548" y="165" text-anchor="middle" class="box-title">API Client</text>
    <text x="548" y="184" text-anchor="middle" class="box-text">Fetch + EventSource</text>
  </g>
  <g>
    <rect x="718" y="144" width="176" height="48" rx="12" class="box" stroke="#8b5cf6"/>
    <text x="806" y="165" text-anchor="middle" class="box-title">ECharts</text>
    <text x="806" y="184" text-anchor="middle" class="box-text">协议、趋势、长度图表</text>
  </g>

  <g>
    <rect x="164" y="288" width="176" height="50" rx="12" class="box" stroke="#1d8bff"/>
    <text x="252" y="309" text-anchor="middle" class="box-title">FileController</text>
    <text x="252" y="328" text-anchor="middle" class="box-text">上传、下载、删除</text>
  </g>
  <g>
    <rect x="430" y="288" width="176" height="50" rx="12" class="box" stroke="#10b981"/>
    <text x="518" y="309" text-anchor="middle" class="box-title">AnalysisController</text>
    <text x="518" y="328" text-anchor="middle" class="box-text">分析、统计、导出、SSE</text>
  </g>
  <g>
    <rect x="696" y="288" width="176" height="50" rx="12" class="box" stroke="#f59e0b"/>
    <text x="784" y="309" text-anchor="middle" class="box-title">HealthController</text>
    <text x="784" y="328" text-anchor="middle" class="box-text">后端状态检查</text>
  </g>
  <g>
    <rect x="910" y="288" width="150" height="50" rx="12" class="box" stroke="#f43f5e"/>
    <text x="985" y="309" text-anchor="middle" class="box-title">ExceptionHandler</text>
    <text x="985" y="328" text-anchor="middle" class="box-text">统一错误响应</text>
  </g>

  <g>
    <rect x="144" y="438" width="178" height="58" rx="12" class="box" stroke="#1d8bff"/>
    <text x="233" y="460" text-anchor="middle" class="box-title">FileStorageService</text>
    <text x="233" y="480" text-anchor="middle" class="box-text">文件保存与级联删除</text>
  </g>
  <g>
    <rect x="364" y="438" width="190" height="58" rx="12" class="box" stroke="#10b981"/>
    <text x="459" y="460" text-anchor="middle" class="box-title">PacketAnalysisService</text>
    <text x="459" y="480" text-anchor="middle" class="box-text">解析、落库、统计生成</text>
  </g>
  <g>
    <rect x="596" y="438" width="162" height="58" rx="12" class="box" stroke="#8b5cf6"/>
    <text x="677" y="460" text-anchor="middle" class="box-title">SummaryService</text>
    <text x="677" y="480" text-anchor="middle" class="box-text">统计响应组装</text>
  </g>
  <g>
    <rect x="800" y="438" width="190" height="58" rx="12" class="box" stroke="#f59e0b"/>
    <text x="895" y="460" text-anchor="middle" class="box-title">SecurityReportService</text>
    <text x="895" y="480" text-anchor="middle" class="box-text">AI 报告生成与保存</text>
  </g>

  <g>
    <rect x="138" y="610" width="184" height="42" rx="12" class="box" stroke="#06b6d4"/>
    <text x="230" y="636" text-anchor="middle" class="box-title">uploads 文件目录</text>
  </g>
  <g>
    <rect x="368" y="610" width="230" height="42" rx="12" class="box" stroke="#8b5cf6"/>
    <text x="483" y="636" text-anchor="middle" class="box-title">MySQL + JPA Repository</text>
  </g>
  <g>
    <rect x="642" y="610" width="176" height="42" rx="12" class="box" stroke="#10b981"/>
    <text x="730" y="636" text-anchor="middle" class="box-title">capinfos / tshark</text>
  </g>
  <g>
    <rect x="862" y="610" width="176" height="42" rx="12" class="box" stroke="#f59e0b"/>
    <text x="950" y="636" text-anchor="middle" class="box-title">AI Provider API</text>
  </g>

  <path class="arrow" d="M548 192 L548 288"/>
  <path class="thin" d="M290 192 C290 235, 252 246, 252 288"/>
  <path class="thin" d="M806 192 C806 235, 784 246, 784 288"/>
  <path class="arrow" d="M252 338 C250 376, 234 398, 233 438"/>
  <path class="arrow" d="M518 338 C500 376, 470 398, 459 438"/>
  <path class="thin" d="M518 338 C570 382, 638 398, 677 438"/>
  <path class="thin" d="M518 338 C646 376, 824 397, 895 438"/>
  <path class="arrow" d="M233 496 L230 610"/>
  <path class="arrow" d="M459 496 C470 538, 480 570, 483 610"/>
  <path class="arrow" d="M459 496 C562 536, 662 570, 730 610"/>
  <path class="thin" d="M677 496 C622 552, 548 580, 483 610"/>
  <path class="arrow" d="M895 496 C920 538, 944 570, 950 610"/>
  <path class="thin" d="M895 496 C760 538, 620 580, 483 610"/>
</svg>
