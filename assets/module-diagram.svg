<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">pcap-anlyzer 功能模块图</title>
  <desc id="desc">以 pcap-anlyzer 网络协议抓包分析系统为中心，展示文件管理、数据包解析、统计可视化、数据包明细、AI 安全报告和结果导出六个功能模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#152238" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="hubGradient" x1="388" y1="260" x2="792" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#24364f"/>
    </linearGradient>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .page-title { font-size: 30px; font-weight: 700; }
      .hub { fill: url(#hubGradient); filter: url(#shadow); }
      .hub-title { fill: #ffffff; font-size: 28px; font-weight: 700; }
      .hub-sub { fill: #d8dee9; font-size: 15px; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .card-title { font-size: 19px; font-weight: 700; }
      .card-text { font-size: 13px; fill: #52606d; }
      .chip { fill: #ffffff; font-size: 12px; font-weight: 700; }
      .line { stroke: #52606d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#f6f8fb"/>
  <text x="54" y="58" class="page-title">功能模块图</text>

  <path class="line" d="M324 252 C356 298, 386 330, 430 350"/>
  <path class="line" d="M590 190 L590 314"/>
  <path class="line" d="M856 252 C824 298, 794 330, 750 350"/>
  <path class="line" d="M324 500 C356 454, 386 422, 430 402"/>
  <path class="line" d="M590 564 L590 446"/>
  <path class="line" d="M856 500 C824 454, 794 422, 750 402"/>

  <g>
    <rect x="430" y="314" width="320" height="132" rx="22" class="hub"/>
    <text x="590" y="372" text-anchor="middle" class="hub-title">pcap-anlyzer</text>
    <text x="590" y="402" text-anchor="middle" class="hub-sub">网络协议抓包分析系统</text>
  </g>

  <g>
    <rect x="72" y="120" width="252" height="132" rx="14" class="card" stroke="#1d8bff"/>
    <rect x="96" y="144" width="76" height="28" rx="14" fill="#1d8bff"/>
    <text x="134" y="163" text-anchor="middle" class="chip">文件</text>
    <text x="96" y="197" class="card-title">文件管理</text>
    <text x="96" y="222" class="card-text">文件上传、下载和删除</text>
    <text x="96" y="244" class="card-text">支持 .pcap、.pcapng、.cap</text>
  </g>

  <g>
    <rect x="464" y="58" width="252" height="132" rx="14" class="card" stroke="#10b981"/>
    <rect x="488" y="82" width="76" height="28" rx="14" fill="#10b981"/>
    <text x="526" y="101" text-anchor="middle" class="chip">解析</text>
    <text x="488" y="135" class="card-title">数据包解析</text>
    <text x="488" y="159" class="card-text">capinfos 统计包数量</text>
    <text x="488" y="181" class="card-text">tshark 解析，SSE 推送进度</text>
  </g>

  <g>
    <rect x="856" y="120" width="252" height="154" rx="14" class="card" stroke="#8b5cf6"/>
    <rect x="880" y="144" width="76" height="28" rx="14" fill="#8b5cf6"/>
    <text x="918" y="163" text-anchor="middle" class="chip">统计</text>
    <text x="880" y="197" class="card-title">统计可视化</text>
    <text x="880" y="220" class="card-text">协议分布、流量趋势</text>
    <text x="880" y="241" class="card-text">长度分布、IP / 端口 Top</text>
    <text x="880" y="262" class="card-text">DNS、HTTP 特征统计</text>
  </g>

  <g>
    <rect x="856" y="500" width="252" height="132" rx="14" class="card" stroke="#f59e0b"/>
    <rect x="880" y="522" width="76" height="28" rx="14" fill="#f59e0b"/>
    <text x="918" y="541" text-anchor="middle" class="chip">AI</text>
    <text x="880" y="575" class="card-title">AI 安全报告</text>
    <text x="880" y="600" class="card-text">基于抓包分析结果生成报告</text>
    <text x="880" y="621" class="card-text">包含风险等级、风险点、处置建议</text>
  </g>

  <g>
    <rect x="464" y="564" width="252" height="132" rx="14" class="card" stroke="#f43f5e"/>
    <rect x="488" y="586" width="76" height="28" rx="14" fill="#f43f5e"/>
    <text x="526" y="605" text-anchor="middle" class="chip">导出</text>
    <text x="488" y="640" class="card-title">结果导出</text>
    <text x="488" y="664" class="card-text">支持导出分析结果</text>
    <text x="488" y="685" class="card-text">CSV、JSON 格式下载</text>
  </g>

  <g>
    <rect x="72" y="500" width="252" height="132" rx="14" class="card" stroke="#06b6d4"/>
    <rect x="96" y="522" width="76" height="28" rx="14" fill="#06b6d4"/>
    <text x="134" y="541" text-anchor="middle" class="chip">明细</text>
    <text x="96" y="575" class="card-title">数据包明细</text>
    <text x="96" y="600" class="card-text">表格展示解析字段</text>
    <text x="96" y="621" class="card-text">支持查看详细 JSON</text>
  </g>

</svg>
